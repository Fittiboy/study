name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install Zig
        uses: mlugg/setup-zig@v2

      - name: Check tag matches build.zig.zon
        shell: bash
        run: |
          set -euo pipefail

          package_version="$(
            sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon
          )"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ "$package_version" != "$tag_version" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match build.zig.zon version ${package_version}"
            exit 1
          fi

      - name: Run tests
        run: zig build test

      - name: Build release binaries
        run: zig build release

      - name: Build release archives
        shell: bash
        run: |
          set -euo pipefail

          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist

          for dir in zig-out/*; do
            [[ -d "$dir" ]] || continue

            target="${dir#zig-out/}"

            if [[ -f "$dir/study.exe" ]]; then
              zip \
                -9 \
                -j \
                "dist/study-${version}-${target}.zip" \
                "$dir/study.exe"
            elif [[ -f "$dir/study" ]]; then
              tar \
                -C "$dir" \
                -czf "dist/study-${version}-${target}.tar.gz" \
                study
            fi
          done

          (
            cd dist
            sha256sum study-* > SHA256SUMS
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "$GITHUB_REF_NAME" \
            dist/* \
            --verify-tag \
            --generate-notes \
            --title "study $GITHUB_REF_NAME"
